name: Build Android TV APK

on:
  push:
    paths:
      - "app/**"
      - "gradle/**"
      - "*.kts"
      - "gradle.properties"
      - "channels.json"
      - "scripts/**"
      - "docs/sports-verification-*.json"
      - ".github/workflows/build.yml"
      - ".codex/**"
      - "AGENTS.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bootstrap and verify the reusable Android development environment
        env:
          # Exercise a fresh SDK, independently of the owner's PC and the runner's preinstalled SDK.
          ANDROID_HOME: ${{ runner.temp }}/amin-tv-sdk
          ANDROID_SDK_ROOT: ${{ runner.temp }}/amin-tv-sdk
        run: bash .codex/setup.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Amin-TV-Preview-${{ github.sha }}
          path: app/build/outputs/preview/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-check-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*
          retention-days: 14

  tv-navigation:
    name: Android TV remote navigation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable hardware acceleration on the disposable CI runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run preview UI checks on Android TV
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/check-tv.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-TV-navigation-${{ github.sha }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/tv-checks/
          retention-days: 14
