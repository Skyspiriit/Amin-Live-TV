name: Approved production release

# Only the repository owner can approve a production run from reviewed main code.
# Development/PR builds never receive these signing secrets or publish a release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Production version tag matching the reviewed app version (vX.Y.Z)'
        required: true
        type: string
      owner_approved:
        description: 'I approve publishing this production release'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main' && inputs.owner_approved
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches the app version
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use vX.Y.Z'; exit 1; }
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          # A two-part version (3.3) is tagged with patch 0 (v3.3.0) so that 0.3.x apps recognise it.
          test "v$version" = "$TAG" || test "v$version.0" = "$TAG" || { echo "Tag $TAG does not match versionName $version"; exit 1; }
          test -f "docs/releases/$TAG.md"
          existing=$(gh release list --limit 100 --json tagName --jq '.[].tagName')
          if printf '%s\n' "$existing" | grep -Fxq "$TAG"; then echo 'This version is already published'; exit 1; fi

      - name: Restore the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.AMIN_LIVE_TV_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Add the AMIN_LIVE_TV_* signing secrets first"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "AMIN_LIVE_TV_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build the signed APK
        env:
          AMIN_LIVE_TV_STORE_PASSWORD: ${{ secrets.AMIN_LIVE_TV_STORE_PASSWORD }}
          AMIN_LIVE_TV_KEY_ALIAS: ${{ secrets.AMIN_LIVE_TV_KEY_ALIAS }}
          AMIN_LIVE_TV_KEY_PASSWORD: ${{ secrets.AMIN_LIVE_TV_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease

      - name: Check the certificate matches the previous release
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          apk=app/build/outputs/apk/release/app-release.apk
          previous=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')
          gh release download "$previous" --pattern '*.apk' --dir previous
          cert() { "$apksigner" verify --print-certs "$1" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1; }
          new=$(cert "$apk"); old=$(cert previous/*.apk)
          echo "New: $new"; echo "Previous ($previous): $old"
          test -n "$new" && test "$new" = "$old"
          test "$new" = ce108de5ce0ebdb7e5d118dc60ac8a2a87899f2553cdb3e9eb6abea1dfe16b3d
          aapt="$(dirname "$apksigner")/aapt"
          new_code=$("$aapt" dump badging "$apk" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          old_code=$("$aapt" dump badging previous/*.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          test "$new_code" -gt "$old_code"
          "$aapt" dump badging "$apk" | grep -q "package: name='com.enigma.aminlivetv'"
          cp "$apk" "Amin-Live-TV-$TAG.apk"
          sha256sum "Amin-Live-TV-$TAG.apk"

      - name: Publish the release
        run: |
          notes="docs/releases/$TAG.md"
          gh release create "$TAG" "Amin-Live-TV-$TAG.apk" --target "$GITHUB_SHA" --title "Amin Live TV $TAG" --notes-file "$notes"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
