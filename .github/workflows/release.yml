name: Signed release

# Pushing a tag such as v0.3.0 builds, tests and signs the APK with the release key kept in
# repository secrets, checks that its certificate matches the previous release so installed
# copies upgrade in place, and publishes it as a GitHub release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches the app version
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          test "v$version" = "$TAG" || { echo "Tag $TAG does not match versionName $version"; exit 1; }

      - name: Restore the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.AMIN_LIVE_TV_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Add the AMIN_LIVE_TV_* signing secrets first"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "AMIN_LIVE_TV_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build the signed APK
        env:
          AMIN_LIVE_TV_STORE_PASSWORD: ${{ secrets.AMIN_LIVE_TV_STORE_PASSWORD }}
          AMIN_LIVE_TV_KEY_ALIAS: ${{ secrets.AMIN_LIVE_TV_KEY_ALIAS }}
          AMIN_LIVE_TV_KEY_PASSWORD: ${{ secrets.AMIN_LIVE_TV_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease

      - name: Check the certificate matches the previous release
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          apk=app/build/outputs/apk/release/app-release.apk
          previous=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')
          gh release download "$previous" --pattern '*.apk' --dir previous
          cert() { "$apksigner" verify --print-certs "$1" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1; }
          new=$(cert "$apk"); old=$(cert previous/*.apk)
          echo "New: $new"; echo "Previous ($previous): $old"
          test -n "$new" && test "$new" = "$old"
          cp "$apk" "Amin-Live-TV-$TAG.apk"
          sha256sum "Amin-Live-TV-$TAG.apk"

      - name: Publish the release
        run: |
          notes="docs/releases/$TAG.md"
          gh release create "$TAG" "Amin-Live-TV-$TAG.apk" --title "Amin Live TV $TAG" --notes-file "$notes"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
