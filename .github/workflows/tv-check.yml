name: Android TV emulator check

# Builds 3.8.0 (main) and this branch, then upgrades one to the other on an Android TV emulator
# and walks the home screen with the D-pad. Screenshots and the report are uploaded.
on:
  push:
    branches: [home-reorganization-3.9]
    paths: ["app/**", "channels.json", ".github/tv-check/**", ".github/workflows/tv-check.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tv:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build 3.8.0 and this branch
        run: |
          git worktree add ../old origin/main
          (cd ../old && bash ./gradlew --no-daemon assembleDebug) && cp ../old/app/build/outputs/apk/debug/app-debug.apk old.apk
          bash ./gradlew --no-daemon assembleDebug && cp app/build/outputs/apk/debug/app-debug.apk new.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/tv-check/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv-check-output
          path: tv-check-output/
